name: Release VSCode extension

on:
  workflow_dispatch:

permissions:
  contents: write
  # Required by actions/attest-build-provenance to sign the release assets.
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Read version from package.json
        id: version
        run: echo "tag=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Package extension
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: npx vsce package --out "open-file-lines-$TAG.vsix"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: open-file-lines-${{ steps.version.outputs.tag }}.vsix

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title="$TAG" \
            --draft \
            --target="$GITHUB_SHA" \
            "open-file-lines-$TAG.vsix"
